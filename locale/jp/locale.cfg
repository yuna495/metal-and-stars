[mod-name]
metal-and-stars=○🌐Metal and Stars

[mod-description]
metal-and-stars=○🌐広大な宇宙には、太陽系を離れる別の手段も存在します。新しい機械、テクノロジー、独自の工程を備えた複数の新たな目的地を追加します

[mod-setting-name]
is-nix-frozen-enabled=ニクスで加熱を必要にする
is-micro-gravity-lab-all-science-enabled=微小重力研究所で基本サイエンスを処理可能にする
is-science-packs-other-labs-enabled=Metal & Starsのサイエンスパックを他の研究所に追加

[mod-setting-description]
is-nix-frozen-enabled=有効にすると、ニクスでもアクィロと同じように加熱が必要になります。
is-micro-gravity-lab-all-science-enabled=有効にすると、微小重力研究所で基本サイエンスを処理できるようになります。通常は宇宙サイエンスのみを処理します。
is-science-packs-other-labs-enabled=有効にすると、Metal & Starsのサイエンスパックが他MODの研究所に追加され、それらの研究所でMetal & Starsのテクノロジーを研究できるようになります。ベースゲームの研究所には影響しません。

#Neumannは姓です。Vはローマ数字の5です。
#Nixはラテン語で夜を意味します。
#Circaはラテン語に近い語で、輪を意味します。
#Mirandusはラテン語の驚きを表す語に由来します。
#CalidusはSpace Exploration MODに由来し、熱いという意味です。
#Senestellaはラテン語に由来し、古い星という意味です。
[space-location-name]
shipyard=ノイマンV
nix=ニクス
ringworld=キルカ
mirandus-a=ミランドゥスA
calidus-senestella-gate-senestella=カリダス・スターゲート
calidus-senestella-gate-calidus=セネステラ・スターゲート

[space-location-description]
shipyard=廃棄された衛星で、周囲のスペースデブリは異様なほど静かです。命令を失ったナナイト、つまり微小な多目的ロボットが構造物の至る所に存在しています。おそらく、この場所を破滅させた原因であり、同時にここまで持ちこたえさせてきた要因でもあります。環境は宇宙プラットフォームに近く、[item=microgravity-assembler]と[item=neumann-conduit]が残骸の各所に散在しています。
nix=非常に長く暗い夜が続くツンドラの惑星です。大量のエネルギーを含む異常な[entity=dark-matter-vent]も存在し、採取できれば大きな力になります。[planet=nix]は[planet=aquilo]に似た凍結環境を持ち、資源は豊富ですが、極寒の中でそれらを採掘するのは容易ではありません。
ringworld=低温の恒星を取り囲む人工リングです。リングの半分は水をたたえて完全に過成長した植生に覆われ、もう半分は砂漠になっています。ここでは常に昼なので、太陽光技術が非常に安定して機能します。
mirandus=量子もつれ状態で存在する砕けた惑星です。ここに着陸することはできませんが、軌道上のミランダイト小惑星から[item=quantite-a]を採掘できます。これは原子を移し替える性質を持つ、状態の揺らぐ鉱物です。
calidus-senestella-gate-senestella=先駆文明の技術です。このゲートウェイにより、船は宇宙空間の2地点間を素早く移動できます。こちらはカリダス、つまり開始星系へつながっています。
calidus-senestella-gate-calidus=先駆文明の技術です。このゲートウェイにより、船は宇宙空間の2地点間を素早く移動できます。こちらはセネステラ、つまりMetal and Stars星系へつながっています。

